name: Windows build, installer, and releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Set tagged release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Expected vMAJOR.MINOR.PATCH release tag." }
          (Get-Content "installer/VertexX.iss" -Raw) -replace '#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$version`"" | Set-Content "installer/VertexX.iss"
          (Get-Content "VertexX/Services/VertexUpdateService.cs" -Raw) -replace 'CurrentVersion = "[^"]+"', "CurrentVersion = `"$version`"" | Set-Content "VertexX/Services/VertexUpdateService.cs"
          Write-Host "Building release $version"
      - name: Restore
        run: dotnet restore VertexX/VertexX.csproj
      - name: Build
        run: dotnet build VertexX/VertexX.csproj -c Release --no-restore
      - name: Publish self-contained Windows x64 app
        run: dotnet publish VertexX/VertexX.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup 6 was not installed." }
          $details = (Get-Item $iscc).VersionInfo.ProductVersion
          Write-Host "Inno Setup version $details"
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\VertexX.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Generate installer SHA256
        shell: pwsh
        run: |
          Get-ChildItem installer-output/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Out-File -FilePath "installer-output/SHA256SUMS.txt" -Encoding utf8
          }
      - uses: actions/upload-artifact@v4
        with:
          name: VertexX-Windows-x64
          path: publish/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: VertexX-Setup-Windows-x64
          path: installer-output/
          if-no-files-found: error
      - name: Publish GitHub release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" installer-output/*.exe installer-output/SHA256SUMS.txt --title "Vertex X ${{ github.ref_name }}" --generate-notes --verify-tag
